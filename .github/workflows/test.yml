# gate-revision: 3
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: find php -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Projection tests
        run: php php/tests/projection_test.php
      - name: MMDemo JS syntax
        run: |
          node --check demo/mmdemo/app.js
          node --check demo/app/mmdemo/renderers/browser.js
      - name: MMDemo relation reconciliation
        run: node demo/mmdemo/tests/reconcile.mjs
      - name: MMDemo MetaModule coverage
        run: node demo/mmdemo/tools/build-coverage.mjs --check
